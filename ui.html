<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Design System Auditor Pro</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  /* Plugin-optimized design system */
  :root {
    --bg-main: #0d1117;
    --bg-card: #161b22;
    --bg-raised: #1c2128;
    --bg-overlay: #21262d;
    --text-primary: #f0f6fc;
    --text-secondary: #8b949e;
    --text-tertiary: #6e7681;
    --accent: #1f6feb;
    --accent-hover: #388bfd;
    --success: #238636;
    --warning: #d29922;
    --danger: #da3633;
    --border: #30363d;
    --border-subtle: #21262d;
    --focus: #1f6feb;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    overflow: hidden; /* Critical: Prevent body scroll */
  }

  /* Main app container - NO SCROLL */
  .app {
    width: 520px;
    height: 700px;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    overflow: hidden; /* Critical: No container scroll */
    background: var(--bg-main);
  }

  /* Compact header */
  .header {
    padding: 12px 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
  }

  .header-main {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: white;
    flex-shrink: 0;
  }

  .title-section {
    flex: 1;
    min-width: 0;
  }

  .title-section h1 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* Compact buttons */
  button {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  button:hover:not(:disabled) {
    background: var(--bg-overlay);
    border-color: var(--accent);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  button.primary:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  button.small {
    padding: 4px 6px;
    font-size: 11px;
  }

  button.success {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }

  /* Compact toolbar */
  .toolbar {
    padding: 8px 16px;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .search-box {
    flex: 1;
    position: relative;
    min-width: 120px;
  }

  .search-box input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 6px 8px 6px 28px;
    color: var(--text-primary);
    font-size: 12px;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 2px rgba(31, 111, 235, 0.2);
  }

  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--text-tertiary);
  }

  .filters {
    display: flex;
    gap: 4px;
  }

  .filter-btn {
    padding: 4px 8px;
    border-radius: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    font-size: 11px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-btn:hover {
    border-color: var(--accent);
  }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* Content area - ONLY place that scrolls */
  .content {
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg-main);
    padding: 8px;
  }

  /* Custom scrollbar for content only */
  .content::-webkit-scrollbar {
    width: 4px;
  }

  .content::-webkit-scrollbar-track {
    background: transparent;
  }

  .content::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
  }

  .content::-webkit-scrollbar-thumb:hover {
    background: var(--text-tertiary);
  }

  /* Stats row */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 12px;
    padding: 0 8px;
  }

  .stat {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 8px 4px;
    text-align: center;
  }

  .stat-number {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .stat-label {
    font-size: 9px;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* Groups */
  .group {
    margin-bottom: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .group-header {
    background: var(--bg-raised);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .group-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-primary);
  }

  .group-controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .group-count {
    font-size: 10px;
    color: var(--text-tertiary);
    background: var(--bg-card);
    padding: 2px 6px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
  }

  /* Compact issues */
  .issue {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    gap: 8px;
    align-items: flex-start;
    transition: background 0.15s ease;
  }

  .issue:last-child {
    border-bottom: none;
  }

  .issue:hover {
    background: var(--bg-raised);
  }

  .issue-checkbox {
    margin-top: 1px;
    accent-color: var(--accent);
  }

  .issue-main {
    flex: 1;
    min-width: 0;
  }

  .issue-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }

  .issue-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .issue-badge {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 1px 4px;
    border-radius: 3px;
    letter-spacing: 0.3px;
  }

  .issue-badge.color { background: var(--danger); color: white; }
  .issue-badge.typography { background: var(--warning); color: white; }
  .issue-badge.spacing { background: var(--accent); color: white; }
  .issue-badge.component { background: var(--success); color: white; }

  .issue-message {
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .issue-suggestion {
    background: rgba(31, 111, 235, 0.1);
    border: 1px solid rgba(31, 111, 235, 0.2);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 10px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .color-preview {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .issue-actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  /* Compact footer */
  .footer {
    padding: 10px 16px;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .footer-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .apply-btn {
    background: var(--accent);
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .apply-btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .apply-btn:disabled {
    background: var(--bg-raised);
    color: var(--text-tertiary);
    cursor: not-allowed;
  }

  /* Empty state */
  .empty-state {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-secondary);
  }

  .empty-state h3 {
    font-size: 14px;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .empty-state p {
    font-size: 12px;
    line-height: 1.4;
  }

  /* Progress indicator */
  .progress {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--bg-raised);
    overflow: hidden;
    display: none;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-hover));
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Accessibility & Polish */
  button:focus,
  input:focus {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }

  /* Loading state */
  .loading {
    opacity: 0.6;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="app" role="application" aria-label="Design System Auditor Pro">

    <!-- Compact Header -->
    <header class="header">
      <div class="header-main">
        <div class="logo" aria-label="Design System Auditor">DS</div>
        <div class="title-section">
          <h1>Design System Auditor Pro</h1>
          <div class="subtitle" id="selectionInfo">No selection</div>
        </div>
      </div>

      <div class="header-controls">
        <button id="btnLoadDesignSystem" title="Load Design System JSON">📁 Load</button>
        <button id="btnScanSelection" class="primary" disabled>🔍 Scan</button>
        <button id="btnScanFull" disabled>📄 Page</button>
        <div id="designSystemInfo" class="subtitle" style="color: var(--warning); flex: 1;">
          No design system loaded
        </div>
      </div>
    </header>

    <!-- Compact Toolbar -->
    <section class="toolbar">
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search issues..."
          aria-label="Search issues"
        />
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="auto">Auto</button>
        <button class="filter-btn" data-filter="color">Color</button>
        <button class="filter-btn" data-filter="typography">Text</button>
        <button class="filter-btn" data-filter="spacing">Space</button>
        <button class="filter-btn" data-filter="component">Comp</button>
      </div>
    </section>

    <!-- Progress Bar -->
    <div class="progress" id="progressBar">
      <div class="progress-bar" id="progressBarFill"></div>
    </div>

    <!-- Scrollable Content Area -->
    <main class="content" id="content" role="main">
      <!-- Stats -->
      <div class="stats" id="stats" style="display: none;">
        <div class="stat">
          <div class="stat-number" id="colorCount">0</div>
          <div class="stat-label">Colors</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="typographyCount">0</div>
          <div class="stat-label">Typography</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="spacingCount">0</div>
          <div class="stat-label">Spacing</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="componentCount">0</div>
          <div class="stat-label">Components</div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="placeholder">
        <h3>Ready to audit</h3>
        <p>Load a design system and scan your selection or page to find design inconsistencies.</p>
      </div>
    </main>

    <!-- Compact Footer -->
    <footer class="footer">
      <div class="footer-info">
        <span id="totalCount">0 issues</span>
        <button id="btnSelectAll" class="small">Select All</button>
      </div>
      <button id="btnApply" class="apply-btn" disabled>Apply Selected</button>
    </footer>

  </div>

  <script>
    // Initialize the application
    class DesignSystemAuditorUI {
      constructor() {
        this.allIssues = [];
        this.filteredIssues = [];
        this.currentFilter = 'all';
        this.searchTerm = '';
        this.isScanning = false;

        this.initializeElements();
        this.bindEvents();

        // Listen for messages from plugin
        window.addEventListener('message', (event) => {
          if (event.data.pluginMessage) {
            this.handleMessage(event.data.pluginMessage);
          }
        });
      }

      initializeElements() {
        // Main elements
        this.content = document.getElementById('content');
        this.placeholder = document.getElementById('placeholder');
        this.stats = document.getElementById('stats');
        this.progressBar = document.getElementById('progressBar');
        this.progressBarFill = document.getElementById('progressBarFill');

        // Controls
        this.btnLoadDesignSystem = document.getElementById('btnLoadDesignSystem');
        this.btnScanSelection = document.getElementById('btnScanSelection');
        this.btnScanFull = document.getElementById('btnScanFull');
        this.btnApply = document.getElementById('btnApply');
        this.btnSelectAll = document.getElementById('btnSelectAll');

        // Info displays
        this.selectionInfo = document.getElementById('selectionInfo');
        this.designSystemInfo = document.getElementById('designSystemInfo');
        this.totalCount = document.getElementById('totalCount');

        // Search and filters
        this.searchInput = document.getElementById('searchInput');
        this.filterButtons = document.querySelectorAll('.filter-btn');

        // Stats
        this.statElements = {
          color: document.getElementById('colorCount'),
          typography: document.getElementById('typographyCount'),
          spacing: document.getElementById('spacingCount'),
          component: document.getElementById('componentCount')
        };
      }

      bindEvents() {
        // Button events
        this.btnLoadDesignSystem.onclick = () => this.showLoadModal();
        this.btnScanSelection.onclick = () => this.scanSelection();
        this.btnScanFull.onclick = () => this.scanFullPage();
        this.btnApply.onclick = () => this.applySelected();
        this.btnSelectAll.onclick = () => this.selectAll();

        // Search
        this.searchInput.oninput = (e) => {
          this.searchTerm = e.target.value;
          this.render();
        };

        // Filter buttons
        this.filterButtons.forEach(button => {
          button.onclick = () => {
            this.filterButtons.forEach(b => b.classList.remove('active'));
            button.classList.add('active');
            this.currentFilter = button.dataset.filter;
            this.render();
          };
        });
      }

      showLoadModal() {
        // Simple file input for now
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const designSystem = JSON.parse(e.target.result);
                parent.postMessage({
                  pluginMessage: {
                    type: 'load-design-system',
                    designSystem: designSystem
                  }
                }, '*');
              } catch (error) {
                alert('Invalid JSON file');
              }
            };
            reader.readAsText(file);
          }
        };
        input.click();
      }

      scanSelection() {
        this.startScanning();
        parent.postMessage({
          pluginMessage: { type: 'scan-selection' }
        }, '*');
      }

      scanFullPage() {
        this.startScanning();
        parent.postMessage({
          pluginMessage: { type: 'scan-full-page' }
        }, '*');
      }

      startScanning() {
        this.isScanning = true;
        this.content.classList.add('loading');
        this.progressBar.style.display = 'block';
        this.animateProgress();
      }

      finishScanning() {
        this.isScanning = false;
        this.content.classList.remove('loading');
        setTimeout(() => {
          this.progressBar.style.display = 'none';
          this.progressBarFill.style.width = '0%';
        }, 300);
      }

      animateProgress() {
        let progress = 0;
        const interval = setInterval(() => {
          progress += Math.random() * 20;
          if (progress >= 90) {
            clearInterval(interval);
            this.progressBarFill.style.width = '90%';
          } else {
            this.progressBarFill.style.width = progress + '%';
          }
        }, 200);
      }

      applySelected() {
        const selected = this.getSelectedIssues();
        if (selected.length > 0) {
          parent.postMessage({
            pluginMessage: {
              type: 'apply-fix',
              issues: selected
            }
          }, '*');
        }
      }

      selectAll() {
        const checkboxes = document.querySelectorAll('.issue-checkbox');
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);

        checkboxes.forEach(checkbox => {
          checkbox.checked = !allChecked;
        });

        this.updateApplyButton();
        this.btnSelectAll.textContent = allChecked ? 'Select All' : 'Deselect All';
      }

      getSelectedIssues() {
        const selected = [];
        const checkboxes = document.querySelectorAll('.issue-checkbox:checked');
        checkboxes.forEach(checkbox => {
          const idx = parseInt(checkbox.dataset.idx);
          if (this.allIssues[idx]) {
            selected.push(this.allIssues[idx]);
          }
        });
        return selected;
      }

      updateApplyButton() {
        const selectedCount = this.getSelectedIssues().length;
        this.btnApply.disabled = selectedCount === 0;
        this.btnApply.textContent = selectedCount > 0 ?
          `Apply Selected (${selectedCount})` : 'Apply Selected';
      }

      updateStats() {
        const stats = { color: 0, typography: 0, spacing: 0, component: 0 };

        this.allIssues.forEach(issue => {
          if (stats.hasOwnProperty(issue.type)) {
            stats[issue.type]++;
          }
        });

        Object.entries(stats).forEach(([type, count]) => {
          if (this.statElements[type]) {
            this.statElements[type].textContent = count;
          }
        });

        this.stats.style.display = this.allIssues.length > 0 ? 'grid' : 'none';
      }

      applyFilters() {
        this.filteredIssues = [];

        for (const issue of this.allIssues) {
          // Type filter
          if (this.currentFilter === 'auto' && !issue.autoFixable) continue;
          if (this.currentFilter !== 'all' && this.currentFilter !== 'auto') {
            if (issue.type !== this.currentFilter) continue;
          }

          // Search filter
          if (this.searchTerm) {
            const searchableText = [
              issue.path || '',
              issue.message || '',
              issue.suggestedColorName || '',
              issue.suggestedTextStyle || ''
            ].join(' ').toLowerCase();

            if (!searchableText.includes(this.searchTerm.toLowerCase())) continue;
          }

          this.filteredIssues.push(issue);
        }
      }

      render() {
        this.applyFilters();
        this.updateStats();

        // Clear content but keep stats
        const statsElement = this.content.querySelector('.stats');
        const emptyElement = this.content.querySelector('.empty-state');

        // Clear all except stats and empty state
        Array.from(this.content.children).forEach(child => {
          if (!child.classList.contains('stats') && !child.classList.contains('empty-state')) {
            child.remove();
          }
        });

        if (!this.filteredIssues || this.filteredIssues.length === 0) {
          if (emptyElement) emptyElement.style.display = 'block';
          this.totalCount.textContent = this.allIssues.length > 0 ?
            `${this.allIssues.length} total` : '0 issues';
          return;
        }

        if (emptyElement) emptyElement.style.display = 'none';
        this.totalCount.textContent = `${this.filteredIssues.length} shown / ${this.allIssues.length} total`;

        const groups = this.groupIssuesByType(this.filteredIssues);
        const typeOrder = ['color', 'typography', 'spacing', 'component'];

        typeOrder.forEach(type => {
          if (!groups[type]) return;

          const groupElement = this.createGroupElement(type, groups[type]);
          this.content.appendChild(groupElement);
        });

        setTimeout(() => this.updateApplyButton(), 0);
      }

      groupIssuesByType(issues) {
        const groups = {};
        issues.forEach((issue, idx) => {
          const type = issue.type || 'other';
          if (!groups[type]) groups[type] = [];
          groups[type].push({ idx: this.allIssues.indexOf(issue), item: issue });
        });
        return groups;
      }

      createGroupElement(type, issues) {
        const group = document.createElement('div');
        group.className = 'group';

        const header = document.createElement('div');
        header.className = 'group-header';

        const title = document.createElement('h2');
        title.className = 'group-title';
        title.textContent = type.toUpperCase();

        const controls = document.createElement('div');
        controls.className = 'group-controls';

        const count = document.createElement('span');
        count.className = 'group-count';
        count.textContent = `${issues.length}`;

        const selectAllBtn = document.createElement('button');
        selectAllBtn.className = 'small';
        selectAllBtn.textContent = 'Select';
        selectAllBtn.onclick = () => {
          issues.forEach(({ idx }) => {
            const checkbox = document.querySelector(`input[data-idx="${idx}"]`);
            if (checkbox) checkbox.checked = true;
          });
          this.updateApplyButton();
        };

        const fixAllBtn = document.createElement('button');
        fixAllBtn.className = 'small success';
        fixAllBtn.textContent = `Fix`;
        fixAllBtn.onclick = () => {
          issues.forEach(({ idx }) => {
            const checkbox = document.querySelector(`input[data-idx="${idx}"]`);
            if (checkbox) checkbox.checked = true;
          });
          this.updateApplyButton();
          setTimeout(() => this.applySelected(), 100);
        };

        controls.appendChild(count);
        controls.appendChild(selectAllBtn);
        controls.appendChild(fixAllBtn);
        header.appendChild(title);
        header.appendChild(controls);
        group.appendChild(header);

        issues.forEach(({ idx, item: issue }) => {
          const issueElement = this.createIssueElement(issue, idx);
          group.appendChild(issueElement);
        });

        return group;
      }

      createIssueElement(issue, idx) {
        const issueDiv = document.createElement('div');
        issueDiv.className = 'issue';

        // Checkbox
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'issue-checkbox';
        checkbox.dataset.idx = idx;
        checkbox.onchange = () => this.updateApplyButton();
        issueDiv.appendChild(checkbox);

        // Main content
        const main = document.createElement('div');
        main.className = 'issue-main';

        // Header with title and badge
        const header = document.createElement('div');
        header.className = 'issue-header';

        const title = document.createElement('div');
        title.className = 'issue-title';
        title.textContent = issue.path || 'Unknown element';
        title.title = issue.path || 'Unknown element';

        const badge = document.createElement('span');
        badge.className = `issue-badge ${issue.type}`;
        badge.textContent = issue.type.toUpperCase();

        header.appendChild(title);
        header.appendChild(badge);
        main.appendChild(header);

        // Message
        const message = document.createElement('div');
        message.className = 'issue-message';
        message.textContent = issue.message;
        main.appendChild(message);

        // Suggestion
        if (issue.suggestedColorName || issue.suggestedTextStyle) {
          const suggestion = document.createElement('div');
          suggestion.className = 'issue-suggestion';

          if (issue.suggestedColorName && issue.currentColor) {
            const colorPreview = document.createElement('div');
            colorPreview.className = 'color-preview';
            colorPreview.style.backgroundColor = this.rgbToHex(
              issue.currentColor.r,
              issue.currentColor.g,
              issue.currentColor.b
            );
            suggestion.appendChild(colorPreview);
          }

          const suggestionText = document.createElement('span');
          suggestionText.textContent = `→ ${issue.suggestedColorName || issue.suggestedTextStyle}`;
          suggestion.appendChild(suggestionText);

          main.appendChild(suggestion);
        }

        issueDiv.appendChild(main);

        // Actions
        const actions = document.createElement('div');
        actions.className = 'issue-actions';

        const selectBtn = document.createElement('button');
        selectBtn.className = 'small';
        selectBtn.textContent = 'Select';
        selectBtn.onclick = () => {
          parent.postMessage({
            pluginMessage: {
              type: 'select-node',
              nodeId: issue.nodeId,
              path: issue.path
            }
          }, '*');
        };

        if (issue.autoFixable) {
          const fixBtn = document.createElement('button');
          fixBtn.className = 'small primary';
          fixBtn.textContent = 'Fix';
          fixBtn.onclick = () => {
            parent.postMessage({
              pluginMessage: {
                type: 'apply-fix',
                issues: [issue]
              }
            }, '*');
          };
          actions.appendChild(fixBtn);
        }

        actions.appendChild(selectBtn);
        issueDiv.appendChild(actions);

        return issueDiv;
      }

      rgbToHex(r, g, b) {
        return "#" + ((1 << 24) + (Math.round(r * 255) << 16) + (Math.round(g * 255) << 8) + Math.round(b * 255)).toString(16).slice(1);
      }

      handleMessage(msg) {
        switch (msg.type) {
          case 'design-system-loaded':
            this.updateDesignSystemStatus(msg.metadata, msg.stats);
            break;

          case 'design-system-error':
            this.designSystemInfo.textContent = 'Error loading design system';
            this.designSystemInfo.style.color = 'var(--danger)';
            break;

          case 'scan-results':
            this.finishScanning();
            this.allIssues = msg.issues.map((issue, idx) => ({
              ...issue,
              idx: idx
            }));
            this.render();
            break;

          case 'selection-changed':
            this.updateSelectionInfo(msg.selection);
            break;
        }
      }

      updateDesignSystemStatus(metadata, stats) {
        this.designSystemInfo.textContent = `${metadata.source || 'Design System'} (${stats.total} styles)`;
        this.designSystemInfo.style.color = 'var(--success)';
        this.btnScanSelection.disabled = false;
        this.btnScanFull.disabled = false;
      }

      updateSelectionInfo(selection) {
        if (selection.length === 0) {
          this.selectionInfo.textContent = 'No selection';
        } else if (selection.length === 1) {
          this.selectionInfo.textContent = `Selected: ${selection[0]}`;
        } else {
          this.selectionInfo.textContent = `Selected: ${selection.length} items`;
        }
      }
    }

    // Initialize the app
    const app = new DesignSystemAuditorUI();
  </script>
</body>
</html>
